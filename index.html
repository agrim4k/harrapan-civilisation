<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Harappan Civilization | Quiz</title>
  
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,400,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      /* Dark Brown Base Background */
      --bg-base: #2b1b17;
      --bg-surface: #3d2721;
      --text-primary: #ffffff;
      --text-secondary: #e6d7c3;
      --accent-primary: #ffcc00;
      --accent-glow: rgba(255, 204, 0, 0.35);
      --color-correct: #2ee681;
      --color-correct-glow: rgba(46, 230, 129, 0.25);
      --color-wrong: #ff5252;
      --color-wrong-glow: rgba(255, 82, 82, 0.25);
      --border-color: rgba(255, 255, 255, 0.2);
      --font-display: 'Clash Display', sans-serif;
      --font-body: 'Satoshi', sans-serif;
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Subtle background ambient lighting */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.4;
    }
    .orb-1 { width: 45vw; height: 45vw; background: #8c5a2b; top: -10%; left: -10%; }
    .orb-2 { width: 35vw; height: 35vw; background: #e69d00; bottom: 5%; right: -5%; }

    .header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(43, 27, 23, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 100;
    }
    .logo { font-size: 1.4rem; font-family: var(--font-display); font-weight: 700; letter-spacing: 1px; color: #fff; }
    .logo span { color: var(--accent-primary); }

    /* Light Brown to Dark Yellow Linear Gradient Quiz Card */
    .quiz-card {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(135deg, #a67c52 0%, #8c6239 50%, #734d26 100%);
      border: 2px solid rgba(255, 220, 150, 0.3);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      margin-top: 80px;
      position: relative;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .q-count { color: var(--text-secondary); font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .progress-fill {
      height: 100%;
      width: 10%;
      background: var(--accent-primary);
      transition: var(--transition-smooth);
    }

    .question-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      line-height: 1.4;
      margin-bottom: 1.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      padding: 1.1rem 1.4rem;
      border-radius: 14px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(.disabled) {
      background: rgba(255, 204, 0, 0.2);
      border-color: var(--accent-primary);
      transform: translateX(4px);
    }

    .option-btn.disabled {
      cursor: default;
    }

    /* Highlight States */
    .option-btn.user-correct {
      background: var(--color-correct-glow) !important;
      border-color: var(--color-correct) !important;
      color: #ffffff !important;
      font-weight: 700;
    }
    .option-btn.user-correct i { color: var(--color-correct); }

    .option-btn.user-wrong {
      background: var(--color-wrong-glow) !important;
      border-color: var(--color-wrong) !important;
      color: #ffffff !important;
      font-weight: 700;
    }
    .option-btn.user-wrong i { color: var(--color-wrong); }

    .option-btn.correct-reveal {
      border-color: var(--color-correct) !important;
      color: #72ffb2 !important;
      font-weight: 700;
    }
    .option-btn.correct-reveal i { color: #72ffb2; }

    /* Answer Banner */
    .answer-banner {
      display: none;
      border-radius: 14px;
      padding: 1.2rem;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .answer-banner.correct-banner {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid var(--color-correct);
      color: #ffffff;
    }
    .answer-banner.wrong-banner {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid var(--color-wrong);
      color: #ffffff;
    }
    .banner-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .correct-banner .banner-title { color: var(--color-correct); }
    .wrong-banner .banner-title { color: var(--color-wrong); }

    .quiz-footer {
      margin-top: 2rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn-action {
      background: var(--accent-primary);
      color: #2b1b17;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .result-view {
      display: none;
      text-align: center;
    }
    .result-view h2 { font-family: var(--font-display); font-size: 2.2rem; margin-bottom: 0.5rem; }
    
    .score-breakdown {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }

    .score-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 1.5rem 2.5rem;
    }

    .score-box .val {
      font-size: 2.5rem;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--accent-primary);
    }
    .score-box .lbl {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .action-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <nav class="header">
    <div class="logo"><i class="fa-solid fa-landmark"></i> <span>HARAPPAN</span> CIVILIZATION</div>
  </nav>

  <main class="quiz-card">
    <div id="quizView">
      <div class="quiz-header">
        <span class="q-count" id="questionCounter">Question 1 of 8</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <h3 class="question-title" id="questionText">Loading question...</h3>

      <div class="options-grid" id="optionsContainer"></div>

      <!-- Detail Answer Banner -->
      <div class="answer-banner" id="answerBanner">
        <div class="banner-title" id="bannerTitle"></div>
        <div id="bannerBody"></div>
      </div>

      <div class="quiz-footer">
        <button class="btn-action" id="nextBtn" disabled onclick="nextQuestion()">Next Question</button>
      </div>
    </div>

    <!-- Completion Result View -->
    <div id="resultView" class="result-view">
      <h2>Quiz Complete!</h2>
      <p style="color: var(--text-secondary);">Great job reviewing the Harappan Civilization PPT.</p>
      
      <div class="score-breakdown">
        <div class="score-box">
          <div class="val"><span id="finalScore">0</span> / <span id="totalQuestions">8</span></div>
          <div class="lbl">Correct Answers</div>
        </div>
      </div>
      
      <div class="action-group">
        <a href="#" onclick="location.reload()" class="btn-action">
          <i class="fa-solid fa-rotate-right"></i> Try Again
        </a>
      </div>
    </div>
  </main>

  <script>
    // Question pool based directly on the Harappan Civilization PPT
    const questionPool = [
      { q: "Along which river valley did the Harappan Civilization flourish around 2600 BCE – 1900 BCE?", options: ["Nile River", "Indus River", "Yellow River", "Tigris River"], correct: 1 },
      { q: "How did Harappan streets intersect in their urban grid layout?", options: ["At 90-degree right angles", "In circular loops", "Randomly with no order", "At 45-degree angles"], correct: 0 },
      { q: "Which elevated western part of the city contained public structures like the Great Bath and Granaries?", options: ["Lower Town", "Citadel", "Suburbs", "Market Square"], correct: 1 },
      { q: "What standardized ratio (thickness : width : length) did Harappans use for their bricks?", options: ["1 : 1 : 2", "1 : 2 : 4", "1 : 3 : 5", "2 : 3 : 4"], correct: 1 },
      { q: "Where were Harappan home entrances located to maintain privacy and reduce street noise?", options: ["Facing the main avenues", "On narrow side lanes", "Through underground tunnels", "On the rooftops"], correct: 1 },
      { q: "What made Harappan sanitation and plumbing unique for its time?", options: ["Covered street drains with inspection manholes", "Open ditches across streets", "No drainage systems existed", "Wooden rain gutters"], correct: 0 },
      { q: "Why is the Harappan written script still considered history's greatest mystery?", options: ["It was erased intentionally", "No bilingual text like a Rosetta Stone has been found to decipher it", "It was written in modern English", "They never had a writing system"], correct: 1 },
      { q: "What were Steatite Seals primarily used for by Harappan merchants?", options: ["As coins for buying bread", "To brand trading cargo", "As household decorations", "To build house walls"], correct: 1 }
    ];

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    let questions = shuffleArray(questionPool);
    let currentIdx = 0;
    let selectedOption = null;
    let isAnswered = false;
    let totalScore = 0;

    function renderQuestion() {
      selectedOption = null;
      isAnswered = false;
      document.getElementById('nextBtn').disabled = true;

      const banner = document.getElementById('answerBanner');
      banner.className = 'answer-banner';
      banner.style.display = 'none';

      const q = questions[currentIdx];
      document.getElementById('questionCounter').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      document.getElementById('questionText').innerText = q.q;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      let optionIndices = q.options.map((_, idx) => idx);

      optionIndices.forEach((originalIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.index = originalIdx;
        btn.innerHTML = `<span>${q.options[originalIdx]}</span> <i class="fa-regular fa-circle"></i>`;
        btn.onclick = () => processAnswer(originalIdx, btn);
        container.appendChild(btn);
      });
    }

    function processAnswer(userChosenIdx, clickedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      selectedOption = userChosenIdx;
      const correctIdx = questions[currentIdx].correct;
      const userIsCorrect = userChosenIdx === correctIdx;

      if (userIsCorrect) {
        totalScore++;
      }

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => {
        btn.classList.add('disabled');
        const btnIdx = parseInt(btn.dataset.index);

        if (btnIdx === userChosenIdx) {
          if (userIsCorrect) {
            btn.classList.add('user-correct');
            btn.querySelector('i').className = 'fa-solid fa-circle-check';
          } else {
            btn.classList.add('user-wrong');
            btn.querySelector('i').className = 'fa-solid fa-circle-xmark';
          }
        } else if (btnIdx === correctIdx && !userIsCorrect) {
          btn.classList.add('correct-reveal');
          btn.querySelector('i').className = 'fa-solid fa-circle-check';
        } else {
          btn.style.opacity = '0.4';
        }
      });

      const banner = document.getElementById('answerBanner');
      const bannerTitle = document.getElementById('bannerTitle');
      const bannerBody = document.getElementById('bannerBody');

      const chosenText = questions[currentIdx].options[userChosenIdx];
      const correctText = questions[currentIdx].options[correctIdx];

      if (userIsCorrect) {
        banner.className = 'answer-banner correct-banner';
        bannerTitle.innerHTML = `<i class="fa-solid fa-circle-check"></i> Correct!`;
        bannerBody.innerHTML = `You selected: <strong>"${chosenText}"</strong>`;
      } else {
        banner.className = 'answer-banner wrong-banner';
        bannerTitle.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Incorrect`;
        bannerBody.innerHTML = `
          <div>You selected: <strong>"${chosenText}"</strong></div>
          <div>Correct Answer: <strong>"${correctText}"</strong></div>
        `;
      }

      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      currentIdx++;

      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quizView').style.display = 'none';
      document.getElementById('resultView').style.display = 'block';

      document.getElementById('finalScore').innerText = totalScore;
      document.getElementById('totalQuestions').innerText = questions.length;
    }

    renderQuestion();
  </script>
</body>
</html>
